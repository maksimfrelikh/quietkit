# quietkit — static site served straight from the build output. No upstream process.
# Copy to /etc/nginx/sites-available/quietkit, symlink into sites-enabled ABOVE the
# `*.frelikh.dev` catch-all of the frelikh site (server_name exact match wins anyway).
# TLS: the wildcard *.frelikh.dev certificate already on the host (DNS-01 via Cloudflare).
#
# CSP is split in two. Astro emits a <meta http-equiv="content-security-policy"> per page
# with default-src/script-src/style-src and the hashes of every inline script and style
# (astro.config.mjs `security.csp`; scripts/check-csp.mjs verifies the build). This header
# carries only what a <meta> CSP cannot: frame-ancestors. Both policies apply, so nothing
# here may be stricter than the meta on script-src/style-src — do not add them.

server {
    listen 80;
    listen [::]:80;
    server_name quietkit.frelikh.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quietkit.frelikh.dev;

    ssl_certificate     /etc/letsencrypt/live/frelikh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frelikh.dev/privkey.pem;

    root /var/www/quietkit/dist;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml font/woff2 text/plain application/xml;

    # Security headers. A location with its own add_header does not inherit these, so
    # location / repeats the full set, and /_astro/ the two that matter for an asset
    # response (nosniff, COOP); HSTS and the framing headers come with every HTML response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Hashed build assets: immutable for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Astro builds /tools/x → /tools/x/index.html (trailingSlash: 'never' + static output).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    error_page 404 /404.html;
}
